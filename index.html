<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="修仙聊天室">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>修仙聊天室</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #1a1a2e; --panel: #16213e; --border: #0f3460; --gold: #d4a574;
      --text: #c9d1d3; --light: #a8b2b8; --accent: #e2b04a; --highlight: #e8d5b0;
      --danger: #e74c3c; --success: #27ae60;
    }
    body {
      background: #0d1117; font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
      color: var(--text); -webkit-tap-highlight-color: transparent;
    }
    .app-container {
      width: 100%; max-width: 480px; height: 100vh; max-height: 900px;
      background: var(--bg); display: flex; flex-direction: column;
      border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    }
    /* 登录界面 */
    .login-screen {
      flex: 1; display: flex; flex-direction: column; justify-content: center;
      align-items: center; gap: 20px; padding: 30px;
    }
    .login-screen h1 { color: var(--accent); font-size: 28px; letter-spacing: 4px; }
    .login-screen input {
      width: 100%; padding: 14px; background: #0a0f18; border: 2px solid var(--border);
      color: var(--text); border-radius: 8px; font-size: 16px; text-align: center; outline: none;
    }
    .login-screen input:focus { border-color: var(--gold); }
    .login-screen button {
      width: 100%; padding: 14px; background: #1e3a5f; border: 2px solid var(--gold);
      color: var(--highlight); border-radius: 8px; font-size: 18px; cursor: pointer;
      letter-spacing: 2px; font-family: inherit;
    }
    .login-screen button:active { background: #0f3460; }
    /* 顶部栏 */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: #111827; border-bottom: 1px solid var(--border);
    }
    .header .title { color: var(--accent); font-size: 17px; font-weight: bold; }
    .header .info { color: var(--light); font-size: 12px; }
    /* 场景信息 */
    .location-bar {
      padding: 10px 14px; background: #0f1923; border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .location-name { color: var(--accent); font-size: 18px; font-weight: bold; }
    .location-desc { color: #7f8c8d; font-size: 13px; margin-top: 4px; }
    .location-players { color: #6b7b8d; font-size: 12px; margin-top: 2px; }
    /* 快捷操作 */
    .quick-actions {
      display: flex; gap: 6px; padding: 8px 14px; background: #0f1923;
      border-bottom: 1px solid var(--border); flex-wrap: wrap; justify-content: center;
    }
    .quick-btn {
      background: #1a2940; border: 1px solid var(--border); color: var(--light);
      padding: 8px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; font-family: inherit;
      white-space: nowrap;
    }
    .quick-btn:active { background: #0f3460; border-color: var(--gold); color: var(--highlight); }
    /* 消息区 */
    .messages {
      flex: 1; overflow-y: auto; padding: 12px; background: #0a0f18; display: flex; flex-direction: column; gap: 6px;
    }
    .msg { padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.6; max-width: 90%; word-break: break-all; }
    .msg-system { background: #1a2740; color: #73c6b6; text-align: center; align-self: center; font-size: 12px; }
    .msg-chat { background: #1e2d45; color: var(--text); align-self: flex-start; }
    .msg-chat .sender { color: var(--accent); font-weight: bold; font-size: 12px; }
    .msg-chat .content { margin-top: 2px; }
    .msg-chat .time { font-size: 10px; color: #6b7b8d; float: right; }
    .msg-action { background: transparent; color: #8e6e4e; text-align: center; align-self: center; font-style: italic; font-size: 13px; }
    .msg-enter { background: transparent; color: #5dade2; text-align: center; align-self: center; font-size: 12px; }
    .msg-leave { background: transparent; color: #7f8c8d; text-align: center; align-self: center; font-size: 12px; }
    /* 输入区 */
    .input-area {
      display: flex; padding: 8px; background: #111827; border-top: 1px solid var(--border); gap: 6px;
    }
    .input-area input {
      flex: 1; background: #0a0f18; border: 1px solid var(--border); color: var(--text);
      padding: 12px; border-radius: 6px; font-size: 14px; font-family: inherit; outline: none;
    }
    .input-area input:focus { border-color: var(--gold); }
    .input-area button {
      background: #1e3a5f; border: 1px solid var(--gold); color: var(--highlight);
      padding: 10px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; font-family: inherit;
    }
    /* 地点选择弹窗 */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--bg); border: 2px solid var(--border); border-radius: 12px;
      padding: 20px; width: 90%; max-width: 400px; max-height: 70vh; overflow-y: auto;
    }
    .modal-content h3 { color: var(--accent); text-align: center; margin-bottom: 14px; }
    .location-list { list-style: none; }
    .location-list li {
      padding: 12px; border-bottom: 1px solid #1e3a5f; cursor: pointer; display: flex;
      justify-content: space-between; align-items: center; border-radius: 6px;
    }
    .location-list li:hover { background: #1a2940; }
    .location-list li .loc-name { color: var(--highlight); }
    .location-list li .loc-count { color: #6b7b8d; font-size: 12px; }
    .close-btn { float: right; background: none; border: none; color: var(--danger); font-size: 22px; cursor: pointer; }
    /* Toast */
    .toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: #1e3a5f; color: var(--highlight); padding: 10px 24px;
      border-radius: 20px; font-size: 14px; z-index: 200; display: none;
    }
    .toast.show { display: block; animation: fadeOut 2s forwards; }
    @keyframes fadeOut { 0%{opacity:1}70%{opacity:1}100%{opacity:0} }
  </style>
</head>
<body>
  <div class="app-container" id="appContainer">
    <!-- 登录界面 -->
    <div class="login-screen" id="loginScreen">
      <h1>☁️ 修仙聊天室</h1>
      <p style="color:var(--light)">踏入青云，问道长生</p>
      <input type="text" id="nameInput" placeholder="请输入你的道号" maxlength="8">
      <button onclick="joinGame()">踏入修仙界</button>
    </div>

    <!-- 游戏主界面（初始隐藏） -->
    <div id="gameScreen" style="display:none;flex:1;display:flex;flex-direction:column;">
      <div class="header">
        <span class="title" id="myName">云霄</span>
        <span class="info" id="myRealm">炼气期</span>
      </div>
      <div class="location-bar">
        <div class="location-name" id="locName">宗门广场</div>
        <div class="location-desc" id="locDesc">青云门中心广场</div>
        <div class="location-players" id="locPlayers">此地道友：0人</div>
      </div>
      <div class="quick-actions">
        <button class="quick-btn" onclick="doAction('cultivate')">🧘 修炼</button>
        <button class="quick-btn" onclick="doAction('battle')">⚔️ 切磋</button>
        <button class="quick-btn" onclick="openLocationModal()">🗺️ 传送</button>
      </div>
      <div class="messages" id="messagesArea"></div>
      <div class="input-area">
        <input type="text" id="chatInput" placeholder="说点什么..." onkeydown="if(event.key==='Enter')sendChat()">
        <button onclick="sendChat()">发送</button>
      </div>
    </div>
  </div>

  <!-- 地点选择弹窗 -->
  <div class="modal" id="locationModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeLocationModal()">✕</button>
      <h3>选择传送地点</h3>
      <ul class="location-list" id="locationList"></ul>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ============ 连接配置 ============
    // 部署后把这里改成你的服务器地址
   const SERVER_URL = 'wss://xiuxian-chat-server.diexiaoyu.deno.net';
    
    let ws = null;
    let myPlayerData = null;
    let currentLocation = '宗门广场';
    const locationNames = ['宗门广场','藏经阁','炼丹堂','炼器堂','后山','灵田','坊市','磐石台','流明河','锋鸣谷'];

    // ============ 登录 ============
    function joinGame() {
      const name = document.getElementById('nameInput').value.trim();
      if (!name) { showToast('请输入道号'); return; }
      if (name.length < 2) { showToast('道号至少2个字'); return; }

      connectToServer(name);
    }

    function connectToServer(name) {
      ws = new WebSocket(SERVER_URL);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'join', name: name }));
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'flex';
        document.getElementById('myName').textContent = name;
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          handleMessage(data);
        } catch (e) {
          console.error('消息解析错误:', e);
        }
      };

      ws.onclose = () => {
        showToast('连接断开，请刷新页面重连');
      };

      ws.onerror = () => {
        showToast('连接失败，请检查服务器地址');
      };
    }

    function handleMessage(data) {
      switch (data.type) {
        case 'init':
          myPlayerData = data.myData;
          currentLocation = data.location;
          document.getElementById('myRealm').textContent = data.myData.realm;
          updateLocationUI(data.location, data.locationDesc, data.locationPlayers);
          addMessage('system', `🌟 欢迎踏入修仙世界，${data.myData.name}！`);
          addMessage('system', `你当前在【${data.location}】，共${data.players.length}位道友在线。`);
          break;

        case 'chat':
          addMessage('chat', data.text, data.from, data.realm, data.time);
          break;

        case 'system':
          addMessage('system', data.text);
          break;

        case 'action':
          addMessage('action', data.text);
          break;

        case 'playerEnter':
          addMessage('enter', `✨ ${data.name}（${data.realm}）来到了此地。`);
          break;

        case 'playerLeave':
          addMessage('leave', `🚶 ${data.name} 离开了此地。`);
          break;

        case 'locationUpdate':
          currentLocation = data.location;
          updateLocationUI(data.location, data.locationDesc, data.locationPlayers);
          addMessage('system', `你传送到了【${data.location}】。`);
          break;
      }
    }

    function updateLocationUI(loc, desc, players) {
      document.getElementById('locName').textContent = loc;
      document.getElementById('locDesc').textContent = desc;
      const names = players.map(p => `${p.name}(${p.realm})`).join('、') || '暂无';
      document.getElementById('locPlayers').textContent = `此地道友：${names}`;
    }

    function addMessage(type, text, from, realm, time) {
      const area = document.getElementById('messagesArea');
      const div = document.createElement('div');
      div.className = 'msg msg-' + type;

      if (type === 'chat') {
        div.innerHTML = `<span class="sender">${from} <span style="color:#f0c27a">[${realm}]</span></span>
                         <span class="time">${time}</span>
                         <div class="content">${escapeHtml(text)}</div>`;
      } else {
        div.textContent = text;
      }

      area.appendChild(div);
      area.scrollTop = area.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ============ 操作 ============
    function sendChat() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text || !ws) return;
      ws.send(JSON.stringify({ type: 'chat', text: text }));
      input.value = '';
    }

    function doAction(action) {
      if (!ws) return;
      ws.send(JSON.stringify({ type: action }));
    }

    function openLocationModal() {
      const list = document.getElementById('locationList');
      list.innerHTML = '';
      locationNames.forEach(loc => {
        const li = document.createElement('li');
        li.innerHTML = `<span class="loc-name">📍 ${loc}</span>`;
        li.onclick = () => {
          if (loc !== currentLocation && ws) {
            ws.send(JSON.stringify({ type: 'move', toLocation: loc }));
          }
          closeLocationModal();
        };
        list.appendChild(li);
      });
      document.getElementById('locationModal').classList.add('active');
    }

    function closeLocationModal() {
      document.getElementById('locationModal').classList.remove('active');
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.className = 'toast show';
      setTimeout(() => { toast.className = 'toast'; }, 2000);
    }
  </script>
</body>
</html>
